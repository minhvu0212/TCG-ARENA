  <text x="70" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#8E9CB2">✓ Booster Box nguyên seal Nhật &amp; Anh  |  ✓ Thẻ lẻ tuyển chọn Near Mint  |  ✓ Elite Trainer Box</text>
  
  <rect x="70" y="320" width="190" height="48" rx="8" fill="#FF5A36"/>
  <text x="165" y="351" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">XEM TẤT CẢ POKÉMON</text>
