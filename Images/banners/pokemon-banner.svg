      <stop offset="0%" stop-color="#14101A"/>
      <stop offset="50%" stop-color="#1C1826"/>
      <stop offset="100%" stop-color="#2D1525"/>
    </linearGradient>
    <radialGradient id="pkmnFire" cx="80%" cy="50%" r="60%">
