<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 650" width="1920" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="40%" stop-color="#121724"/>
      <stop offset="70%" stop-color="#171C2B"/>
      <stop offset="100%" stop-color="#0D111A"/>
    </linearGradient>
    <radialGradient id="pkmnGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#E8B84A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#121724" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ygoGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3978FF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#9A4AFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#121724" stop-opacity="0"/>
    </radialGradient>
    <filter id="arenaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1920" height="650" fill="url(#bgGrad)"/>
  <rect width="1920" height="650" fill="url(#pkmnGlow)"/>
  <rect width="1920" height="650" fill="url(#ygoGlow)"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.12" stroke="#3978FF" stroke-width="1.5">
    <line x1="0" y1="520" x2="1920" y2="520"/>
    <line x1="0" y1="570" x2="1920" y2="570"/>
    <line x1="0" y1="615" x2="1920" y2="615"/>
    <line x1="100" y1="520" x2="0" y2="650"/>
    <line x1="300" y1="520" x2="200" y2="650"/>
    <line x1="500" y1="520" x2="430" y2="650"/>
    <line x1="700" y1="520" x2="660" y2="650"/>
    <line x1="960" y1="520" x2="960" y2="650"/>
    <line x1="1220" y1="520" x2="1260" y2="650"/>
    <line x1="1420" y1="520" x2="1490" y2="650"/>
    <line x1="1620" y1="520" x2="1720" y2="650"/>
    <line x1="1820" y1="520" x2="1920" y2="650"/>
  </g>

  <!-- Left Side: Pokémon Aesthetic Motifs -->
  <g transform="translate(180, 160)" opacity="0.85">
    <!-- Pokeball Halo -->
    <circle cx="160" cy="160" r="140" fill="none" stroke="#E8B84A" stroke-width="3" stroke-dasharray="12 8" opacity="0.4"/>
    <circle cx="160" cy="160" r="120" fill="#171C2B" stroke="#FF5A36" stroke-width="4" opacity="0.3"/>
    <!-- Floating Card: Charizard Silhouette style -->
    <rect x="70" y="50" width="180" height="260" rx="14" fill="#1C1826" stroke="#E8B84A" stroke-width="3" transform="rotate(-12 160 180)" filter="url(#arenaGlow)"/>
    <rect x="85" y="65" width="150" height="130" rx="8" fill="#FF5A36" opacity="0.25" transform="rotate(-12 160 180)"/>
    <text x="160" y="270" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#FFE79A" text-anchor="middle" transform="rotate(-12 160 180)">POKÉMON TCG</text>
    <circle cx="160" cy="120" r="35" fill="#FFE79A" opacity="0.8" transform="rotate(-12 160 180)"/>
  </g>

  <!-- Right Side: Yu-Gi-Oh! Aesthetic Motifs -->
  <g transform="translate(1380, 150)" opacity="0.85">
    <!-- Millennium Eye Circle -->
    <circle cx="180" cy="170" r="150" fill="none" stroke="#3978FF" stroke-width="3" stroke-dasharray="16 10" opacity="0.4"/>
    <!-- Duel Disk Card -->
    <rect x="90" y="40" width="180" height="260" rx="14" fill="#141A2E" stroke="#70A6FF" stroke-width="3" transform="rotate(14 180 170)" filter="url(#arenaGlow)"/>
    <rect x="105" y="55" width="150" height="130" rx="8" fill="#3978FF" opacity="0.25" transform="rotate(14 180 170)"/>
    <text x="180" y="260" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#70A6FF" text-anchor="middle" transform="rotate(14 180 170)">YU-GI-OH! TCG</text>
    <!-- Eye of Anubis Pyramid -->
    <polygon points="180,85 215,145 145,145" fill="none" stroke="#FFE79A" stroke-width="3" transform="rotate(14 180 170)"/>
    <circle cx="180" cy="122" r="8" fill="#FFE79A" transform="rotate(14 180 170)"/>
  </g>

  <!-- Center Decorative Glow & Badges -->
  <circle cx="960" cy="300" r="280" fill="#3978FF" opacity="0.06"/>
  <circle cx="960" cy="300" r="180" fill="#E8B84A" opacity="0.04"/>

  <!-- Energy sparks -->
  <circle cx="480" cy="180" r="3" fill="#FFE79A"/>
  <circle cx="580" cy="340" r="4" fill="#FF5A36"/>
  <circle cx="1340" cy="220" r="3.5" fill="#70A6FF"/>
  <circle cx="1450" cy="420" r="5" fill="#3978FF"/>
</svg>